[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-honeypot"
version = "0.1.0"
description = "A low-interaction SSH honeypot with a fake shell, SQLite storage and a read-only dashboard"
readme = "README.md"
license = "MIT"
authors = [{ name = "Emre Özaydın" }]
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.17,<3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "maxminddb>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# mini-siem is NOT a dependency. The auth.log compatibility test imports its
# parser when it is installed next to this project (README "Development") and
# is skipped otherwise.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
honeypot = "sshhoneypot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sshhoneypot = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["mini-siem"]  # CI checks the sibling project out here for one test

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
